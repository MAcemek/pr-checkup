name: PR checkup

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-checkup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checkup:
    runs-on: ubuntu-latest
    steps:
      # On pull_request_target this checks out the BASE branch, so `uses: ./` runs the
      # already-reviewed action code. Never add `ref: ${{ github.event.pull_request.head.sha }}`.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./
